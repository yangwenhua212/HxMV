<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HxMV 控制台</title>
<style>
  /* HxSync NIGHT 深色绿系（Forest #1F7A65 / Moss #3D9B7A） */
  :root {
    --bg: #0A1210; --panel: #10211C; --panel2: #162B24; --border: rgba(61,155,122,.22);
    --text: #E4F0EA; --dim: #8FA89E; --accent: #3D9B7A; --accent-strong: #4CC38A;
    --green: #4CC38A; --amber: #E0B25C; --red: #F0716B; --purple: #B394E8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 13px 20px; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, #0E1C18, #0A1210); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
  header h1 b { color: var(--accent-strong); font-weight: 700; }
  #brainBadge { margin-left: auto; font-size: 13px; color: var(--dim); }
  main { padding: 16px 20px; max-width: 1400px; margin: 0 auto; }
  /* 顶部分页：生产 / 设置 */
  nav.tabs { display: flex; gap: 6px; }
  nav.tabs button { background: transparent; border: 1px solid transparent; color: var(--dim); padding: 5px 15px; border-radius: 999px; font-size: 14px; }
  nav.tabs button.on { background: var(--panel2); border-color: var(--border); color: var(--text); font-weight: 600; }
  .page { display: grid; grid-template-columns: 1fr 330px; gap: 16px; align-items: start; }
  .page[hidden] { display: none; }
  #pageSettings { grid-template-columns: 1fr; max-width: 680px; margin: 0 auto; }
  /* 设置页：接口配置 */
  .kv { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .kv b { min-width: 76px; font-weight: 600; }
  .kv input { flex: 1; min-width: 170px; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: 14px; font-family: inherit; }
  .kv input:focus { outline: none; border-color: var(--accent); }
  .kv button { background: var(--accent); border: none; color: #0A1210; font-weight: 700; }
  .kv button:hover { background: var(--accent-strong); }
  .st { font-size: 12px; padding: 2px 10px; border-radius: 999px; }
  .st.ok { background: rgba(76,195,138,.14); color: var(--accent-strong); border: 1px solid rgba(76,195,138,.4); }
  .st.no { background: rgba(143,168,158,.1); color: var(--dim); border: 1px solid var(--border); }
  #cfgHint { font-size: 13px; color: var(--accent-strong); min-height: 18px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; }
  .card h3 { font-size: 13px; color: var(--dim); font-weight: 600; margin-bottom: 12px; letter-spacing: 1px; }

  /* 提交区 */
  textarea { width: 100%; height: 64px; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: 15px; resize: vertical; font-family: inherit; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 10px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  select, button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px; font-size: 14px; cursor: pointer; font-family: inherit; }
  select:focus { outline: none; border-color: var(--accent); }
  #runBtn { background: var(--accent); border: none; color: #0A1210; font-weight: 700; padding: 9px 26px; }
  #runBtn:hover { background: var(--accent-strong); }
  #runBtn:disabled { opacity: .5; cursor: not-allowed; }
  #runHint { font-size: 13px; color: var(--amber); min-height: 18px; }

  /* 时间线 */
  .ev { border-left: 2px solid var(--border); padding: 1px 0 16px 18px; margin-left: 7px; position: relative; }
  .ev::before { content: ""; position: absolute; left: -7px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--border); border: 2px solid var(--bg); }
  .ev.run.start::before { background: var(--accent); }
  .ev.run.done::before { background: var(--accent-strong); }
  .ev.decision.PASS::before { background: var(--green); }
  .ev.decision.RETRY::before { background: var(--amber); }
  .ev.decision.FAIL::before { background: var(--red); }
  .ev .meta { font-size: 12px; color: var(--dim); margin-bottom: 1px; }
  .ev .title { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ev .title .act { color: #0A1210; background: var(--accent); font-weight: 700; padding: 1px 10px; border-radius: 999px; font-size: 12px; }
  .ev .title .act.retry { background: rgba(224,178,92,.85); }
  .ev .sub { font-size: 14px; margin-top: 4px; }
  .pill { display: inline-block; font-size: 12px; padding: 1px 10px; border-radius: 999px; margin: 4px 6px 0 0; font-weight: 500; }
  .pill.green { background: rgba(76,195,138,.14); color: var(--accent-strong); border: 1px solid rgba(76,195,138,.4); }
  .pill.amber { background: rgba(224,178,92,.12); color: var(--amber); border: 1px solid rgba(224,178,92,.4); }
  .pill.red { background: rgba(240,113,107,.12); color: var(--red); border: 1px solid rgba(240,113,107,.4); }
  .pill.gray { background: rgba(143,168,158,.1); color: var(--dim); border: 1px solid var(--border); }
  .pill.purple { background: rgba(179,148,232,.14); color: var(--purple); border: 1px solid rgba(179,148,232,.4); }
  .scorebar { display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .layer { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .bar { width: 70px; height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; }
  .scoresum { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }

  /* 右侧栏 */
  aside { display: flex; flex-direction: column; gap: 16px; }
  #brainList, #runsList { max-height: 320px; overflow-y: auto; }
  .bentry { font-size: 13px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; background: var(--panel2); }
  .bentry .c { color: var(--text); display: block; margin-top: 4px; line-height: 1.55; }
  .bentry .imp { float: right; color: var(--dim); font-size: 11px; }
  .runit { font-size: 13px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; background: var(--panel2); cursor: pointer; }
  .runit:hover { border-color: var(--accent); }
  .runit .g { color: var(--text); font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .runit .s { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; }
  .dot.done { background: var(--green); } .dot.running { background: var(--amber); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .empty { color: var(--dim); font-size: 13px; text-align: center; padding: 26px 0; }
  #sumBox { display: none; }
  #sumBody .line { padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  #sumBody .line:last-child { border-bottom: none; }
  footer { text-align: center; color: var(--dim); font-size: 12px; padding: 18px; }
  @media (max-width: 900px) { .page { grid-template-columns: 1fr; } main, #pageSettings { padding: 12px; } body { font-size: 16px; } }
</style>
</head>
<body>
<header>
  <h1>HxMV <b>自主内容生产闭环</b></h1>
  <nav class="tabs">
    <button class="tab on" data-page="produce">生产</button>
    <button class="tab" data-page="settings">设置</button>
  </nav>
  <div id="brainBadge"></div>
</header>

<main>
  <div class="page" id="pageProduce">
  <section>
    <div class="card" id="authCard">
      <h3>连接</h3>
      <div class="row">
        <input id="tokenInput" placeholder="令牌（HxMV 实例的 HXMV_WEB_TOKEN）">
        <button id="connectBtn">连接</button>
        <span id="connStatus">未填令牌</span>
      </div>
    </div>

    <div class="card" id="submitCard">
      <h3>开始生产</h3>
      <textarea id="goalInput" placeholder="想做什么内容？例如：一只柯基在雪地里打滚，8 秒短片"></textarea>
      <div class="row">
        <select id="providerSel">
          <option value="zhipu">智谱 AI 真视频（免费）</option>
          <option value="local">本地真渲染</option>
          <option value="mock">模拟世界</option>
          <option value="fake">线上仿真</option>
          <option value="kling">可灵 API</option>
        </select>
        <input id="projectInput" placeholder="项目名（留空=一次性；填了会记住风格/角色，续做不重画）">​
        <button id="runBtn">开始生产</button>
        <span id="runHint"></span>
      </div>
    </div>

    <div class="card" id="liveCard">
      <h3 id="liveTitle">实时过程</h3>
      <div id="timeline"></div>
    </div>

    <div class="card" id="sumBox">
      <h3>执行报告</h3>
      <div id="sumBody"></div>
    </div>
  </section>

  <aside>
    <div class="card">
      <h3>大脑记忆</h3>
      <div id="brainList"></div>
    </div>
    <div class="card">
      <h3>历史</h3>
      <div id="runsList"></div>
    </div>
  </aside>
  </div>

  <div class="page" id="pageSettings" hidden>
    <section>
      <div class="card">
        <h3>接口配置</h3>
        <div class="kv">
          <b>智谱 AI</b><span class="st no" id="stZhipu">未配置</span>
        </div>
        <div class="kv">
          <input id="keyZhipu" type="password" placeholder="粘贴 API Key" autocomplete="off">
          <button id="saveZhipu">保存</button>
        </div>
        <div class="kv">
          <b>视频模型</b>
          <select id="videoModel">
            <option value="cogvideox-flash">CogVideoX-Flash · 免费</option>
            <option value="cogvideox-3">CogVideoX-3 · 1 元/次</option>
            <option value="cogvideox-2">CogVideoX-2 · 0.5 元/次</option>
          </select>
        </div>
        <div class="kv">
          <b>视觉评审</b>
          <select id="vlmModel">
            <option value="glm-4v-flash">GLM-4V-Flash · 免费</option>
            <option value="glm-4.6v-flashx">GLM-4.6V-FlashX · 0.15 元/百万</option>
            <option value="glm-4.6v">GLM-4.6V · 1 元/百万</option>
          </select>
          <span class="st no" id="vlmState">未开启</span>
        </div>
        <div class="kv" style="margin-top:16px">
          <b>可灵</b><span class="st no" id="stKling">未配置</span>
        </div>
        <div class="kv">
          <input id="keyKling" type="password" placeholder="粘贴 API Key（可选）" autocomplete="off">
          <button id="saveKling">保存</button>
        </div>
        <div class="kv"><span id="cfgHint"></span></div>
      </div>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let currentRun = null, es = null, hintTimer = null;

// ---- 公网 token ----
const URLTOKEN = new URLSearchParams(location.search).get("token") || "";
let TOKEN = URLTOKEN || localStorage.getItem("hxmvToken") || "";
if (URLTOKEN) localStorage.setItem("hxmvToken", URLTOKEN);
function hx(path, opts = {}) {
  opts.headers = Object.assign({ "X-Hxmv-Token": TOKEN }, opts.headers || {});
  return fetch(path, opts);
}
function sseUrl(path) { return path + (path.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(TOKEN); }

// 页面上直接填令牌（原来只能靠 ?token= 进网址，没填就等于用不了）
async function refreshConn() {
  const el = $("connStatus");
  if (!TOKEN) { el.textContent = "未填令牌"; return; }
  try {
    const d = await (await hx("/api/health")).json();
    el.textContent = (d.needs_token && !d.authed) ? "令牌不对" : "已连接 · " + d.server;
  } catch (e) {
    el.textContent = "连不上";
  }
}
$("tokenInput").value = TOKEN;
$("connectBtn").onclick = () => {
  TOKEN = $("tokenInput").value.trim();
  localStorage.setItem("hxmvToken", TOKEN);
  refreshConn();
  refreshBrain();
  refreshRuns();
  refreshConfig();
};
$("tokenInput").addEventListener("keydown", e => { if (e.key === "Enter") $("connectBtn").click(); });

// ---- 人话字典（渲染层翻译，内核事件不动） ----
const ACTIONS = { STORYBOARD: "分镜", GENERATE_CHARACTER: "角色", GENERATE_SCENE: "场景", GENERATE_SHOT: "镜头", COMPOSE: "成片" };
const FAILURES = {
  black_frame: "黑帧", low_clarity: "清晰度不足", motion_blur: "运动模糊", fps_too_low: "帧率过低",
  low_volume: "音量过低", no_audio: "没有音轨", character_inconsistency: "角色不一致", scene_inconsistency: "场景不一致",
  semantic_mismatch: "与剧本不符", frozen_frame: "画面静止", too_short: "时长不足", too_long: "超时长"
};
const SUGGESTIONS = {
  increase_reference_strength: "加强参考", reduce_motion_scale: "减小运动幅度",
  increase_motion_scale: "提高运动幅度", increase_resolution: "升到 720p", increase_fps: "提到 30fps",
  boost_audio_gain: "音量增益", enable_audio: "加上音轨", trim_black_frames: "去掉黑场", extend_duration: "补时长",
  trim_duration: "裁时长", rewrite_prompt_closer: "贴合剧本"
};
const zh = (d, k, fb) => d[k] || fb || k;
const fmt = t => new Date(t * 1000).toLocaleTimeString("zh-CN", { hour12: false });
const layerColor = s => s >= 0.8 ? "var(--green)" : s >= 0.6 ? "var(--amber)" : "var(--red)";
function zhContent(s) {
  // 记忆条目里的英文失败/修正键翻译
  for (const k in FAILURES) s = s.split(k).join(FAILURES[k]);
  for (const k in SUGGESTIONS) s = s.split(k).join(SUGGESTIONS[k]);
  return s.replace("修正成功", "修正有效").replace("失败「", "「").replace("」用 ", "」 → ");
}
function hint(msg, isErr) {
  $("runHint").textContent = (isErr ? "⚠ " : "✓ ") + msg;
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => $("runHint").textContent = "", 4000);
}

// ---------- 大脑 ----------
async function refreshBrain() {
  try {
    const d = await (await hx("/api/brain")).json();
    $("brainBadge").textContent = `🧠 ${d.size} 条经验`;
    const box = $("brainList");
    if (!d.entries.length) { box.innerHTML = '<div class="empty">跑一次就会开始积累</div>'; return; }
    box.innerHTML = d.entries.map(e =>
      `<div class="bentry">` +
      (e.hits_3 ? '<span class="pill green">已沉淀</span>' : `<span class="pill purple">${e.kind === "LESSON" ? "经验" : "事实"}</span>`) +
      `<span class="imp">×${e.hit_count}</span>` +
      `<span class="c">${esc(zhContent(e.content))}</span></div>`).join("");
  } catch (e) {}
}

// ---------- 历史 ----------
async function refreshRuns() {
  try {
    const d = await (await hx("/api/runs")).json();
    const box = $("runsList");
    if (!d.runs.length) { box.innerHTML = '<div class="empty">暂无</div>'; return; }
    box.innerHTML = d.runs.map(r => {
      const t = r.tail || {};
      const running = r.status !== "done";
      const stat = t.type === "run.done"
        ? `${(t.completed || []).length} 完成 · ${(t.failed || []).length} 失败 · 尝试 ${t.attempts}`
        : "进行中…";
      const ts = r.ts ? fmt(r.ts) : "";
      return `<div class="runit" onclick="replay('${r.run_id}')">
        <span class="g"><span class="dot ${running ? "running" : "done"}"></span>${esc(r.goal.slice(0, 30))}</span>
        <span class="s">${ts} · ${stat}</span></div>`;
    }).join("");
  } catch (e) {}
}

// ---------- 渲染事件 ----------
function renderEvent(ev, container) {
  const div = document.createElement("div");
  div.className = "ev " + (ev.type + " " + (ev.decision || "")).toLowerCase();
  const t = `<div class="meta">${fmt(ev.ts)}</div>`;
  const actName = ACTIONS[ev.action] || ev.action;

  if (ev.type === "run.start") {
    div.innerHTML = t + `<div class="title">开始生产</div><div class="sub">${esc(ev.goal)}</div>`;
  } else if (ev.type === "task.start") {
    div.innerHTML = t + `<div class="title"><span class="act ${ev.kind === "retry" ? "retry" : ""}">${actName}</span>${ev.kind === "retry" ? "重新生成" : ev.prompt ? esc(ev.prompt.slice(0, 40)) : ""}</div>`;
  } else if (ev.type === "infra.retry") {
    div.innerHTML = t + `<div class="title" style="color:var(--amber)">服务繁忙，重试 ${ev.attempt}/4</div>`;
  } else if (ev.type === "critic") {
    const layers = (ev.layers || []).map(l =>
      `<span class="layer">${l.layer.split("_")[0]}</span><span class="bar"><i style="width:${Math.round(l.score * 100)}%;background:${layerColor(l.score)}"></i></span>`).join("");
    const pills = (ev.failures || []).map((f, i) =>
      `<span class="pill red">${zh(FAILURES, f)} · ${zh(SUGGESTIONS, (ev.suggestions || [])[i])}</span>`).join("");
    const measured = ev.detail ? `<div class="sub" style="color:var(--dim)">🔍 ${esc(ev.detail)}</div>` : "";
    div.innerHTML = t + `<div class="title">质量评审 <span class="scoresum" style="color:${layerColor(ev.score)}">${ev.score.toFixed(2)}</span></div>
      <div class="scorebar">${layers}</div>${pills ? `<div>${pills}</div>` : ""}${measured}`;
  } else if (ev.type === "decision") {
    const map = { PASS: ["通过", "green"], RETRY: ["修正后重试", "amber"], FAIL: ["失败", "red"] };
    const [label, cls] = map[ev.decision] || [ev.decision, "gray"];
    let extra = "";
    if (ev.decision === "PASS" && ev.fixes_applied?.length) {
      extra = `<div class="sub" style="color:var(--dim)">已记住：${ev.fixes_applied.map(f => zh(FAILURES, f.failure) + "用" + zh(SUGGESTIONS, f.suggestion) + "修").join("、")}</div>`;
    } else if (ev.decision === "RETRY") {
      extra = `<div class="sub" style="color:var(--dim)">第 ${ev.attempts_used}/${ev.max_attempts} 次</div>`;
    } else if (ev.decision === "FAIL") {
      extra = `<div class="sub" style="color:var(--dim)">多次修正仍未达标</div>`;
    }
    div.innerHTML = t + `<div class="title"><span class="pill ${cls}">${label}</span></div>${extra}`;
  } else if (ev.type === "run.done") {
    const rows = (ev.completed || []).map(c => `<div class="sub">✅ ${ACTIONS[c.action] || c.action}${c.refine_history.length ? `（修正 ${c.refine_history.length} 次）` : ""}</div>`).join("");
    const fails = (ev.failed || []).map(f => `<div class="sub">❌ ${ACTIONS[f.action] || f.action}</div>`).join("");
    div.innerHTML = t + `<div class="title">生产完成</div>${rows || ""}${fails}
      <div class="sub" style="color:var(--dim)">${ev.completed.length} 项完成 · ${ev.attempts} 次尝试 · ${ev.cost_units} 元${ev.budget_exhausted ? " · 预算用尽" : ""}</div>`;
    closeLive("完成");
  }
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function closeLive(tag) {
  setTimeout(() => { if (es) { es.close(); es = null; } }, 300);
  $("liveTitle").textContent = `实时过程 · ${tag}`;
  refreshBrain(); refreshRuns();
}

// ---------- 提交 ----------
async function submitRun() {
  const goal = $("goalInput").value.trim();
  if (!goal) { hint("先输入想做什么", true); return; }
  const provider = $("providerSel").value;
  const project = $("projectInput").value.trim();
  $("runBtn").disabled = true; $("runBtn").textContent = "生产中…";
  try {
    const res = await (await hx("/api/run", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ goal, provider, project })
    })).json();
    if (res.error) throw new Error(res.error);
    startStream(res.run_id);
  } catch (e) {
    hint("提交失败，请重试", true);
  }
  $("runBtn").disabled = false; $("runBtn").textContent = "开始生产";
}

// ---------- SSE 实时 ----------
function startStream(runId) {
  if (es) es.close();
  currentRun = runId;
  const tl = $("timeline");
  tl.innerHTML = ""; $("sumBox").style.display = "none";
  $("liveTitle").textContent = "实时过程";
  es = new EventSource(sseUrl(`/api/stream?run_id=${runId}`));
  es.onmessage = e => {
    const ev = JSON.parse(e.data);
    renderEvent(ev, tl);
    if (ev.type === "run.done") showSummary(ev, runId);
  };
  es.onerror = () => {};
}

function showSummary(ev, runId) {
  $("sumBox").style.display = "block";
  const rows = (ev.completed || []).map(c =>
    `<div class="line">✅ <b>${ACTIONS[c.action] || c.action}</b> · 质量 ${c.score}${c.refine_history.length ? ` · 修正 ${c.refine_history.length} 次` : ""}</div>`).join("");
  // 真实产物（local provider）：只给落盘的绝对路径做下载/预览链接
  const files = (ev.outputs || []).filter(p => String(p).startsWith("/"));
  const arts = files.map(p => {
    const name = String(p).split("/").pop();
    const url = `/api/artifact?run_id=${encodeURIComponent(runId)}&name=${encodeURIComponent(name)}&token=${encodeURIComponent(TOKEN)}`;
    const kind = name.startsWith("final") ? "成片" : name.endsWith(".png") ? "参考图" : "镜头";
    return `<div class="line">🎬 ${kind} <a href="${url}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(name)}</a></div>`;
  }).join("");
  $("sumBody").innerHTML = (rows || '<div class="empty">本次没有完成任务</div>') + arts;
}

// ---------- 回放 ----------
async function replay(runId) {
  const tl = $("timeline"); tl.innerHTML = ""; $("sumBox").style.display = "none";
  if (es) { es.close(); es = null; }
  currentRun = null;
  $("liveTitle").textContent = "历史回放";
  try {
    const d = await (await hx(`/api/run/${runId}`)).json();
    for (const ev of d.events) {
      const div = document.createElement("div");
      div.className = "ev " + (ev.type + " " + (ev.decision || "")).toLowerCase();
      const t = `<div class="meta">${fmt(ev.ts)}</div>`;
      const actName = ACTIONS[ev.action] || ev.action;
      let html = "";
      if (ev.type === "run.start") html = t + `<div class="title">开始</div><div class="sub">${esc(ev.goal)}</div>`;
      else if (ev.type === "task.start") html = t + `<div class="title"><span class="act ${ev.kind === "retry" ? "retry" : ""}">${actName}</span></div>`;
      else if (ev.type === "infra.retry") html = t + `<div class="title" style="color:var(--amber)">服务繁忙，重试 ${ev.attempt}/4</div>`;
      else if (ev.type === "critic") html = t + `<div class="title">评审 <span class="scoresum" style="color:${layerColor(ev.score)}">${ev.score.toFixed(2)}</span></div><div>${(ev.failures || []).map(f => `<span class="pill red">${zh(FAILURES, f)}</span>`).join("")}</div>`;
      else if (ev.type === "decision") html = t + `<div class="title">${ev.decision === "PASS" ? "✅ 通过" : ev.decision === "RETRY" ? "🔧 重试" : "❌ 失败"}</div>`;
      else if (ev.type === "run.done") html = t + `<div class="title">完成</div><div class="sub" style="color:var(--dim)">${ev.completed.length} 项完成 · ${ev.attempts} 次尝试</div>`;
      else continue;
      div.innerHTML = html; tl.appendChild(div);
    }
  } catch (e) { tl.innerHTML = '<div class="empty">回放失败</div>'; }
}

// ---------- 分页 ----------
function showPage(name) {
  $("pageProduce").hidden = (name !== "produce");
  $("pageSettings").hidden = (name !== "settings");
  document.querySelectorAll("nav.tabs .tab").forEach(b => b.classList.toggle("on", b.dataset.page === name));
  if (name === "settings") refreshConfig();
}
document.querySelectorAll("nav.tabs .tab").forEach(b => { b.onclick = () => showPage(b.dataset.page); });

// ---------- 设置页：接口配置 ----------
let cfgTimer = null;
function cfgHint(msg) {
  $("cfgHint").textContent = msg;
  clearTimeout(cfgTimer);
  cfgTimer = setTimeout(() => $("cfgHint").textContent = "", 4000);
}
async function refreshConfig() {
  if (!TOKEN) { cfgHint("先在上面填令牌"); return; }
  try {
    const d = await (await hx("/api/config")).json();
    if (d.error) { cfgHint("令牌不对，配置读不到"); return; }
    for (const p of d.providers) {
      const el = p.id === "zhipu" ? $("stZhipu") : $("stKling");
      el.textContent = p.configured ? "已配置 " + p.masked : "未配置";
      el.className = "st " + (p.configured ? "ok" : "no");
    }
    $("videoModel").value = d.options.video_model;
    $("vlmModel").value = d.options.vlm_model;
    $("vlmState").textContent = d.vision.ready ? "已开启 · " + d.vision.model : "未开启";
    $("vlmState").className = "st " + (d.vision.ready ? "ok" : "no");
  } catch (e) { cfgHint("配置读取失败"); }
}
async function saveConfig(provider, keyId) {
  const body = { provider };
  const key = $(keyId).value.trim();
  if (key) body.key = key;
  if (provider === "zhipu") { body.video_model = $("videoModel").value; body.vlm_model = $("vlmModel").value; }
  try {
    const d = await (await hx("/api/config", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body) })).json();
    if (d.ok) { $(keyId).value = ""; cfgHint("已保存，立即生效"); refreshConfig(); }
    else cfgHint("保存失败，请重试");
  } catch (e) { cfgHint("保存失败，请重试"); }
}
$("saveZhipu").onclick = () => saveConfig("zhipu", "keyZhipu");
$("saveKling").onclick = () => saveConfig("kling", "keyKling");
$("videoModel").onchange = () => saveConfig("zhipu", "keyZhipu");
$("vlmModel").onchange = () => saveConfig("zhipu", "keyZhipu");

$("runBtn").onclick = submitRun;
$("goalInput").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) submitRun(); });
refreshConn();
refreshBrain(); refreshRuns();
setInterval(refreshBrain, 10000);
</script>
