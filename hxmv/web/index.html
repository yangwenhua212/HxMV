<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HxMV 控制台</title>
<style>
  /* HxSync NIGHT 深色绿系（Forest #1F7A65 / Moss #3D9B7A） */
  :root {
    --bg: #0A1210; --panel: #10211C; --panel2: #162B24; --border: rgba(61,155,122,.22);
    --text: #E4F0EA; --dim: #8FA89E; --accent: #3D9B7A; --accent-strong: #4CC38A;
    --green: #4CC38A; --amber: #E0B25C; --red: #F0716B; --purple: #B394E8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 13px 20px; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, #0E1C18, #0A1210); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
  header h1 b { color: var(--accent-strong); font-weight: 700; }
  #brainBadge { margin-left: auto; font-size: 13px; color: var(--dim); }
  main { padding: 16px 20px; max-width: 1400px; margin: 0 auto; }
  /* 顶部分页：生产 / 设置 */
  nav.tabs { display: flex; gap: 6px; }
  nav.tabs button { background: transparent; border: 1px solid transparent; color: var(--dim); padding: 5px 15px; border-radius: 999px; font-size: 14px; }
  nav.tabs button.on { background: var(--panel2); border-color: var(--border); color: var(--text); font-weight: 600; }
  .page { display: grid; grid-template-columns: 1fr 330px; gap: 16px; align-items: start; }
  .page[hidden] { display: none; }
  #pageSettings { grid-template-columns: 1fr; max-width: 680px; margin: 0 auto; }
  /* 设置页：接口配置 */
  .kv { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .kv b { min-width: 76px; font-weight: 600; }
  .kv input { flex: 1; min-width: 170px; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: 14px; font-family: inherit; }
  .kv input:focus { outline: none; border-color: var(--accent); }
  .kv button { background: var(--accent); border: none; color: #0A1210; font-weight: 700; }
  .kv button:hover { background: var(--accent-strong); }
  .st { font-size: 12px; padding: 2px 10px; border-radius: 999px; }
  .st.ok { background: rgba(76,195,138,.14); color: var(--accent-strong); border: 1px solid rgba(76,195,138,.4); }
  .st.no { background: rgba(143,168,158,.1); color: var(--dim); border: 1px solid var(--border); }
  #cfgHint { font-size: 13px; color: var(--accent-strong); min-height: 18px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; }
  .card h3 { font-size: 13px; color: var(--dim); font-weight: 600; margin-bottom: 12px; letter-spacing: 1px; }

  /* 提交区 */
  textarea { width: 100%; height: 64px; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: 15px; resize: vertical; font-family: inherit; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 10px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  select, button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px; font-size: 14px; cursor: pointer; font-family: inherit; }
  select:focus { outline: none; border-color: var(--accent); }
  #runBtn { background: var(--accent); border: none; color: #0A1210; font-weight: 700; padding: 9px 26px; }
  #runBtn:hover { background: var(--accent-strong); }
  #runBtn:disabled { opacity: .5; cursor: not-allowed; }
  #runHint { font-size: 13px; color: var(--amber); min-height: 18px; }
  .row input { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: 14px; font-family: inherit; min-width: 140px; }
  .row input:focus { outline: none; border-color: var(--accent); }
  .row input::placeholder { color: var(--dim); }
  #projectInput, #refKey { flex: 1; }

  /* 参考图：图生视频的首帧 */
  #refHint { font-size: 13px; color: var(--accent-strong); min-height: 18px; margin-top: 8px; }
  .fileBtn { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px; font-size: 14px; cursor: pointer; }
  .fileBtn:hover { border-color: var(--accent); }
  #refFileName { font-size: 13px; color: var(--dim); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #refPreview { display: none; width: 100%; margin-top: 10px; border-radius: 10px; border: 1px solid var(--border); }
  .refGrid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .refItem { position: relative; width: 104px; }
  .refItem img { width: 104px; height: 62px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); display: block; background: var(--panel2); }
  .refItem b { display: block; font-size: 12px; font-weight: 500; color: var(--dim); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .refItem button { position: absolute; top: 3px; right: 3px; padding: 0 6px; font-size: 12px; line-height: 18px; border-radius: 6px; background: rgba(10,18,16,.8); color: var(--red); border: 1px solid var(--border); }
  .batchHint { font-size: 13px; color: var(--dim); margin: 10px 0 6px; }
  .batchRow { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .batchRow .fname { flex: 0 1 40%; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .batchRow input { flex: 1; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; color: var(--text); font-size: 13px; min-width: 0; }
  .batchRow button { padding: 3px 9px; font-size: 13px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--border); color: var(--red); }
  /* 成片/产物：在页面里直接播/看（手机点链接不播） */
  .art { width: 100%; margin: 6px 0 12px; border-radius: 10px; border: 1px solid var(--border); background: #000; display: block; }
  .art-img { background: none; }
  /* 过程记录折叠：不让几十条事件把成品挤到屏幕外 */
  details.proc > summary { cursor: pointer; color: var(--dim); font-size: 13px; padding: 2px 0 6px; }
  details.proc[open] > summary { margin-bottom: 12px; }
  /* 对话：跟 HxMV 说需求（像跟人说话一样） */
  #chatLog { max-height: 300px; overflow-y: auto; margin-bottom: 8px; }
  .chatMsg { max-width: 88%; padding: 7px 11px; border-radius: 12px; margin: 6px 0; font-size: 14px;
             line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .chatMsg.me { background: var(--accent); color: #04231b; margin-left: auto; }
  .chatMsg.mv { background: var(--panel2); border: 1px solid var(--border); }
  .goBtn { display: block; margin-top: 8px; width: 100%; padding: 8px; border-radius: 10px;
           background: var(--green); color: #04231b; border: none; font-size: 14px; font-weight: 600; }
  #discardBtn { background: none; border: 1px solid var(--red); color: var(--red); border-radius: 9px;
                padding: 5px 11px; font-size: 13px; }

  /* 时间线 */
  .ev { border-left: 2px solid var(--border); padding: 1px 0 16px 18px; margin-left: 7px; position: relative; }
  .ev::before { content: ""; position: absolute; left: -7px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--border); border: 2px solid var(--bg); }
  .ev.run.start::before { background: var(--accent); }
  .ev.run.done::before { background: var(--accent-strong); }
  .ev.decision.PASS::before { background: var(--green); }
  .ev.decision.RETRY::before { background: var(--amber); }
  .ev.decision.FAIL::before { background: var(--red); }
  .ev .meta { font-size: 12px; color: var(--dim); margin-bottom: 1px; }
  .ev .title { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ev .title .act { color: #0A1210; background: var(--accent); font-weight: 700; padding: 1px 10px; border-radius: 999px; font-size: 12px; }
  .ev .title .act.retry { background: rgba(224,178,92,.85); }
  .ev .sub { font-size: 14px; margin-top: 4px; }
  .pill { display: inline-block; font-size: 12px; padding: 1px 10px; border-radius: 999px; margin: 4px 6px 0 0; font-weight: 500; }
  .pill.green { background: rgba(76,195,138,.14); color: var(--accent-strong); border: 1px solid rgba(76,195,138,.4); }
  .pill.amber { background: rgba(224,178,92,.12); color: var(--amber); border: 1px solid rgba(224,178,92,.4); }
  .pill.red { background: rgba(240,113,107,.12); color: var(--red); border: 1px solid rgba(240,113,107,.4); }
  .pill.gray { background: rgba(143,168,158,.1); color: var(--dim); border: 1px solid var(--border); }
  .pill.purple { background: rgba(179,148,232,.14); color: var(--purple); border: 1px solid rgba(179,148,232,.4); }
  .scorebar { display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .layer { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .bar { width: 70px; height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; }
  .scoresum { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }

  /* 右侧栏 */
  aside { display: flex; flex-direction: column; gap: 16px; }
  #brainList, #runsList { max-height: 320px; overflow-y: auto; }
  .bentry { font-size: 13px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; background: var(--panel2); }
  .bentry .c { color: var(--text); display: block; margin-top: 4px; line-height: 1.55; }
  .bentry .imp { float: right; color: var(--dim); font-size: 11px; }
  .runit { font-size: 13px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; background: var(--panel2); cursor: pointer; }
  .runit:hover { border-color: var(--accent); }
  .runit .g { color: var(--text); font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .runit .s { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; }
  .dot.done { background: var(--green); } .dot.running { background: var(--amber); animation: blink 1s infinite; }
  .dot.aborted { background: var(--red); }
  @keyframes blink { 50% { opacity: .2; } }
  .empty { color: var(--dim); font-size: 13px; text-align: center; padding: 26px 0; }
  #sumBox { display: none; }
  #sumBody .line { padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  #sumBody .line:last-child { border-bottom: none; }
  footer { text-align: center; color: var(--dim); font-size: 12px; padding: 18px; }
  @media (max-width: 900px) { .page { grid-template-columns: 1fr; } main, #pageSettings { padding: 12px; } body { font-size: 16px; } }

  /* ===== v2 视觉层 =====
     对齐市面 AI 视频生成产品（Runway / 可灵 / 即梦那类）的观感：
     大创作区（hero）+ 作品库卡片（缩略图、悬停预览、一键删）+ 干净留白；
     主题仍是 HxSync NIGHT 深绿，不吃掉任何既有 id/class 契约。 */
  body {
    background:
      radial-gradient(1100px 560px at 12% -12%, rgba(61,155,122,.16), transparent 62%),
      radial-gradient(900px 480px at 108% 4%, rgba(76,195,138,.10), transparent 58%),
      var(--bg);
  }
  header { backdrop-filter: blur(14px); background: rgba(10,18,16,.74); border-bottom-color: rgba(61,155,122,.18); }
  header h1 { font-size: 18px; }
  .mark { width: 26px; height: 26px; border-radius: 9px; flex: none;
          background: linear-gradient(135deg, var(--accent), var(--accent-strong));
          box-shadow: 0 6px 18px rgba(76,195,138,.3); }
  main { max-width: 1320px; padding: 22px 22px 44px; }
  .page { grid-template-columns: minmax(0, 1fr) 392px; gap: 18px; }
  .card { border-radius: 20px; background: linear-gradient(180deg, rgba(22,43,36,.72), rgba(16,33,28,.94));
          box-shadow: 0 10px 30px rgba(0,0,0,.22); }
  .card h3 { font-size: 12px; letter-spacing: 1.4px; }

  /* 创作区当 hero：这块是主角，视觉上要压得住 */
  #submitCard { border-color: rgba(76,195,138,.32);
                box-shadow: 0 18px 52px rgba(0,0,0,.34), inset 0 0 0 1px rgba(76,195,138,.07); }
  #submitCard textarea { height: 86px; font-size: 16px; border-radius: 14px; }
  #runBtn { width: 100%; padding: 12px 26px; border-radius: 13px; font-size: 15px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #04140f;
            box-shadow: 0 12px 28px rgba(76,195,138,.22); }
  #runBtn:hover { filter: brightness(1.06); }

  /* 作品库：卡片墙（缩略图 + 悬停播放 + 动作） */
  #runsList { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px;
              max-height: none; overflow: visible; }
  .vcard { border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: var(--panel2);
           cursor: pointer; transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease; }
  .vcard:hover { transform: translateY(-2px); border-color: rgba(76,195,138,.5);
                 box-shadow: 0 14px 32px rgba(0,0,0,.34); }
  .vthumb { position: relative; aspect-ratio: 16/9; background: #06100d; }
  .vthumb video, .vthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .vthumb .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                color: rgba(143,168,158,.7); font-size: 20px; }
  .vthumb .badge { position: absolute; left: 7px; top: 7px; display: inline-flex; align-items: center; gap: 6px;
                   background: rgba(6,16,13,.74); border: 1px solid var(--border); border-radius: 999px;
                   padding: 2px 8px; font-size: 11px; backdrop-filter: blur(6px); }
  .vthumb .dur { position: absolute; right: 7px; bottom: 7px; background: rgba(6,16,13,.74);
                 border-radius: 6px; padding: 1px 6px; font-size: 11px; font-variant-numeric: tabular-nums; }
  .vbody { padding: 9px 10px 10px; }
  .vbody .g { font-weight: 600; font-size: 13px; display: block; overflow: hidden;
              text-overflow: ellipsis; white-space: nowrap; }
  .vbody .s { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .vacts { display: flex; gap: 7px; margin-top: 9px; }
  .vacts button { flex: 1; padding: 6px; font-size: 12px; border-radius: 9px; }
  .vacts .del { color: var(--red); border-color: rgba(240,113,107,.45); background: rgba(240,113,107,.06); }

  /* 播放器与报告 */
  .art { border-radius: 14px; box-shadow: 0 16px 44px rgba(0,0,0,.42); }
  #sumBody .line { border-bottom-color: rgba(61,155,122,.14); }
  #liveCard .ev .sub { color: var(--text); }
  footer { opacity: .65; }
  @media (max-width: 900px) {
    .page { grid-template-columns: 1fr; }
    #runsList { grid-template-columns: 1fr 1fr; }
    #runBtn { font-size: 16px; }
  }
  @media (max-width: 420px) { #runsList { grid-template-columns: 1fr; } }
  /* 小屏顶栏别挤成两行：只留品牌名 + 紧凑分页 */
  @media (max-width: 560px) {
    header { gap: 8px; padding: 11px 14px; }
    header h1 { font-size: 15px; white-space: nowrap; }
    header h1 b { display: none; }
    #brainBadge { display: none; }
    nav.tabs button { padding: 4px 11px; font-size: 13px; }
    .card { border-radius: 18px; padding: 14px; }
    /* 国产浏览器会把正文字号放大（小米浏览器实测），控件必须能缩能换行，不许顶出卡片 */
    select, .row input, textarea, button { max-width: 100%; min-width: 0; }
    .row > select, .row > input { flex: 1 1 100%; }
    #submitCard textarea { height: 76px; }
  }
  /* 连接（含状态）只出现在「设置」里，生产页顶栏不摆任何配置/连接相关的东西 */
  #brainBadge { margin-left: auto; }
  /* 空对话不留空框 */
  #chatLog:empty { display: none; }
</style>
</head>
<body>
<header>
  <div class="mark"></div>
  <h1>HxMV <b>自主内容生产闭环</b></h1>
  <nav class="tabs">
    <button class="tab on" data-page="produce">生产</button>
    <button class="tab" data-page="settings">设置</button>
  </nav>
  <div id="brainBadge"></div>
</header>

<main>
  <div class="page" id="pageProduce">
  <section>
    <div class="card" id="chatCard">
      <h3>对话</h3>
      <div id="chatLog"></div>
      <div class="row">
        <input id="chatInput" placeholder="说一句：想做什么片 / 想改哪里（如「刚才那条改成夜晚，5 秒」）">
        <button id="chatSend">发送</button>
      </div>
      <div id="chatHint"></div>
    </div>

    <div class="card" id="submitCard">
      <h3>开始生产</h3>
      <textarea id="goalInput" placeholder="想做什么内容？例如：一只柯基在雪地里打滚，8 秒短片"></textarea>
      <div class="row">
        <select id="providerSel">
          <option value="zhipu">智谱 AI 真视频（免费）</option>
          <option value="local">本地真渲染</option>
          <option value="mock">模拟世界</option>
          <option value="fake">线上仿真</option>
          <option value="kling">可灵 API</option>
        </select>
        <input id="projectInput" placeholder="项目名（留空=一次性；填了会记住风格/角色，续做不重画）">​
        <button id="runBtn">开始生产</button>
        <span id="runHint"></span>
      </div>
    </div>

    <div class="card" id="worksCard">
      <h3>作品</h3>
      <div id="runsList"></div>
    </div>

    <div class="card" id="refCard">
      <h3>参考图 · 图生视频的首帧</h3>
      <div class="row">
        <select id="refKind">
          <option value="character">角色</option>
          <option value="scene">场景</option>
        </select>
        <input id="refKey" placeholder="键名（镜头里的角色名／场景名）">
        <select id="refMode">
          <option value="auto">自动裁主视觉</option>
          <option value="crop_top">只取上部</option>
          <option value="keep">原样不裁</option>
        </select>
      </div>
      <div class="row">
        <label class="fileBtn" for="refFile">选图片</label>
        <input id="refFile" type="file" accept="image/*" multiple hidden>
        <span id="refFileName"></span>
        <button id="refPreviewBtn">预览</button>
        <button id="refSaveBtn">存为参考图</button>
      </div>
      <div id="refHint"></div>
      <img id="refPreview" alt="">
      <div id="refBatch"></div>
      <div class="refGrid" id="refList"></div>
    </div>

    <div class="card" id="sumBox">
      <h3>执行报告</h3>
      <div id="sumBody"></div>
    </div>

    <div class="card" id="liveCard">
      <h3 id="liveTitle">实时过程</h3>
      <div id="timeline"></div>
    </div>
  </section>

  <aside>
    <div class="card">
      <h3>大脑记忆</h3>
      <div id="brainList"></div>
    </div>
  </aside>
  </div>

  <div class="page" id="pageSettings" hidden>
    <section>
      <div class="card" id="authCard">
        <h3>连接</h3>
        <div class="row">
          <input id="tokenInput" placeholder="令牌（该实例的 HXMV_WEB_TOKEN）">
          <button id="connectBtn">连接</button>
          <span id="connStatus">未填令牌</span>
        </div>
      </div>

      <div class="card">
        <h3>接口配置</h3>
        <div class="kv">
          <b>智谱 AI</b><span class="st no" id="stZhipu">未配置</span>
        </div>
        <div class="kv">
          <input id="keyZhipu" type="password" placeholder="粘贴 API Key" autocomplete="off">
          <button id="saveZhipu">保存</button>
        </div>
        <div class="kv">
          <b>视频模型</b>
          <select id="videoModel">
            <option value="cogvideox-flash">CogVideoX-Flash · 免费</option>
            <option value="cogvideox-3">CogVideoX-3 · 1 元/次</option>
            <option value="cogvideox-2">CogVideoX-2 · 0.5 元/次</option>
          </select>
        </div>
        <div class="kv">
          <b>视觉评审</b>
          <select id="vlmModel">
            <option value="glm-4v-flash">GLM-4V-Flash · 免费</option>
            <option value="glm-4.6v-flashx">GLM-4.6V-FlashX · 0.15 元/百万</option>
            <option value="glm-4.6v">GLM-4.6V · 1 元/百万</option>
          </select>
          <span class="st no" id="vlmState">未开启</span>
        </div>
        <div class="kv" style="margin-top:16px">
          <b>可灵</b><span class="st no" id="stKling">未配置</span>
        </div>
        <div class="kv">
          <input id="keyKling" type="password" placeholder="粘贴 API Key（可选）" autocomplete="off">
          <button id="saveKling">保存</button>
        </div>
        <div class="kv"><span id="cfgHint"></span></div>
      </div>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let currentRun = null, es = null, hintTimer = null;

// ---- 公网 token ----
const URLTOKEN = new URLSearchParams(location.search).get("token") || "";
let TOKEN = URLTOKEN || localStorage.getItem("hxmvToken") || "";
if (URLTOKEN) localStorage.setItem("hxmvToken", URLTOKEN);
function hx(path, opts = {}) {
  opts.headers = Object.assign({ "X-Hxmv-Token": TOKEN }, opts.headers || {});
  return fetch(path, opts);
}
function sseUrl(path) { return path + (path.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(TOKEN); }
/** 产物地址（缩略图 / 播放器共用）：面板也种了 Cookie，两条路都通。 */
function artUrl(runId, name) {
  return `/api/artifact?run_id=${encodeURIComponent(runId)}&name=${encodeURIComponent(name)}&token=${encodeURIComponent(TOKEN)}`;
}
// 拉接口并保证拿到真数据：401（没填/填错令牌）等错误在这里抛出真实原因，
// 别让页面把「{error:...}」当成正常数据渲染出 undefined（真机出现过「🧠 undefined 条经验」）
async function apiGet(path) {
  const d = await (await hx(path)).json();
  if (d && d.error) throw new Error(d.error);
  return d;
}

// 连接状态：以接口回的 authed/needs_token 为准——Cookie 生效时 localStorage 可能是空的，
// 不能再拿「TOKEN 是不是空」当「没连上」（真机踩过：状态卡在「未填令牌」）
async function refreshConn() {
  const el = $("connStatus");
  try {
    const d = await (await hx("/api/health")).json();
    if (d.authed) { el.textContent = "已连接 · " + d.server; return; }
    el.textContent = d.needs_token ? (TOKEN ? "令牌不对" : "未填令牌") : "连不上";
  } catch (e) {
    el.textContent = "连不上";
  }
}
// 令牌不回显到输入框（截图/旁观就漏了）；要换令牌直接在这粘贴新的再点连接
$("tokenInput").placeholder = TOKEN ? "令牌已保存（换新令牌就在这粘贴）" : "令牌（该实例的 HXMV_WEB_TOKEN）";
$("connectBtn").onclick = () => {
  // 框里有新值就用新值；没有（已连接后我们不再回显令牌）就沿用已保存的
  const typed = $("tokenInput").value.trim();
  if (typed) {
    TOKEN = typed;
    localStorage.setItem("hxmvToken", TOKEN);
  }
  $("tokenInput").value = "";                 // 别把令牌长期明文摆在屏幕上（截图就漏了）
  $("tokenInput").placeholder = TOKEN ? "令牌已保存（换新令牌就在这粘贴）" : "令牌（该实例的 HXMV_WEB_TOKEN）";
  refreshConn();
  refreshBrain();
  refreshRuns();
  refreshConfig();
  refreshRef();
};
$("tokenInput").addEventListener("keydown", e => { if (e.key === "Enter") $("connectBtn").click(); });

// ---- 人话字典（渲染层翻译，内核事件不动） ----
const ACTIONS = { STORYBOARD: "分镜", GENERATE_CHARACTER: "角色", GENERATE_SCENE: "场景", GENERATE_SHOT: "镜头", COMPOSE: "成片" };
const FAILURES = {
  black_frame: "黑帧", low_clarity: "清晰度不足", motion_blur: "运动模糊", fps_too_low: "帧率过低",
  low_volume: "音量过低", no_audio: "缺音轨（任务要了音频）", character_inconsistency: "角色不一致", scene_inconsistency: "场景不一致",
  semantic_mismatch: "与剧本不符", frozen_frame: "画面静止", too_short: "时长不足", too_long: "超时长"
};
const SUGGESTIONS = {
  increase_reference_strength: "加强参考", reduce_motion_scale: "减小运动幅度",
  increase_motion_scale: "提高运动幅度", increase_resolution: "升到 720p", increase_fps: "提到 30fps",
  boost_audio_gain: "音量增益", enable_audio: "加上音轨", trim_black_frames: "去掉黑场", extend_duration: "补时长",
  trim_duration: "裁时长", rewrite_prompt_closer: "贴合剧本"
};
const zh = (d, k, fb) => d[k] || fb || k;
const fmt = t => new Date(t * 1000).toLocaleTimeString("zh-CN", { hour12: false });
const layerColor = s => s >= 0.8 ? "var(--green)" : s >= 0.6 ? "var(--amber)" : "var(--red)";
function zhContent(s) {
  // 记忆条目里的英文失败/修正键翻译
  for (const k in FAILURES) s = s.split(k).join(FAILURES[k]);
  for (const k in SUGGESTIONS) s = s.split(k).join(SUGGESTIONS[k]);
  return s.replace("修正成功", "修正有效").replace("失败「", "「").replace("」用 ", "」 → ");
}
function hint(msg, isErr) {
  $("runHint").textContent = (isErr ? "⚠ " : "✓ ") + msg;
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => $("runHint").textContent = "", 4000);
}

// ---------- 大脑 ----------
async function refreshBrain() {
  try {
    const d = await apiGet("/api/brain");
    $("brainBadge").textContent = `🧠 ${d.size} 条经验`;
    const box = $("brainList");
    if (!(d.entries || []).length) { box.innerHTML = '<div class="empty">跑一次就会开始积累</div>'; return; }
    box.innerHTML = d.entries.map(e =>
      `<div class="bentry">` +
      (e.hits_3 ? '<span class="pill green">已沉淀</span>' : `<span class="pill purple">${e.kind === "LESSON" ? "经验" : "事实"}</span>`) +
      `<span class="imp">×${e.hit_count}</span>` +
      `<span class="c">${esc(zhContent(e.content))}</span></div>`).join("");
  } catch (e) {
    // 没连上时明确说状态，别渲染出 undefined / 一直空着
    $("brainBadge").textContent = TOKEN ? "连不上" : "未填令牌";
  }
}

// ---------- 历史 ----------
async function refreshRuns() {
  try {
    const d = await apiGet("/api/runs");
    const box = $("runsList");
    const runs = d.runs || [];
    if (!runs.length) { box.innerHTML = '<div class="empty" style="grid-column:1/-1">还没有作品</div>'; return; }
    box.innerHTML = runs.map(r => {
      const t = r.tail || {};
      const st = r.status === "done" ? "done" : (r.status === "aborted" ? "aborted" : "running");
      const label = st === "done" ? "完成" : st === "aborted" ? "已中断" : "生成中";
      const stat = st === "done"
        ? `${(t.completed || []).length} 完成 · ${(t.failed || []).length} 失败 · 尝试 ${t.attempts}`
        : st === "aborted" ? "被打断（可重跑）" : "进行中…";
      // 封面：成片/镜头抽第一帧当缩略图（#t=0.1 让浏览器直接渲染出画面，别只给黑框）
      const poster = r.poster ? artUrl(r.run_id, r.poster) : "";
      const isVid = !!r.poster && r.poster.toLowerCase().endsWith(".mp4");
      const thumb = !poster ? '<div class="ph">🎬</div>'
        : isVid
          ? `<video src="${poster}#t=0.1" preload="metadata" muted playsinline loop
               onmouseover="this.play()" onmouseout="this.pause();this.currentTime=0"></video>`
          : `<img src="${poster}" alt="">`;
      return `<div class="vcard" onclick="replay('${r.run_id}')">
        <div class="vthumb">${thumb}<span class="badge"><span class="dot ${st}"></span>${label}</span></div>
        <div class="vbody">
          <span class="g">${esc((r.goal || "").slice(0, 40))}</span>
          <span class="s">${r.ts ? fmt(r.ts) : ""} · ${stat}</span>
          <div class="vacts">
            <button onclick="event.stopPropagation();replay('${r.run_id}')">打开</button>
            <button class="del" onclick="event.stopPropagation();discardRun('${r.run_id}')">删掉</button>
          </div>
        </div></div>`;
    }).join("");
  } catch (e) {
    $("runsList").innerHTML = `<div class="empty" style="grid-column:1/-1">${TOKEN ? "连不上" : "未填令牌"}</div>`;
  }
}

// ---------- 渲染事件 ----------
function renderEvent(ev, container) {
  const div = document.createElement("div");
  div.className = "ev " + (ev.type + " " + (ev.decision || "")).toLowerCase();
  const t = `<div class="meta">${fmt(ev.ts)}</div>`;
  const actName = ACTIONS[ev.action] || ev.action;

  if (ev.type === "run.start") {
    div.innerHTML = t + `<div class="title">开始生产</div><div class="sub">${esc(ev.goal)}</div>`;
  } else if (ev.type === "task.start") {
    div.innerHTML = t + `<div class="title"><span class="act ${ev.kind === "retry" ? "retry" : ""}">${actName}</span>${ev.kind === "retry" ? "重新生成" : ev.prompt ? esc(ev.prompt.slice(0, 40)) : ""}</div>`;
  } else if (ev.type === "infra.retry") {
    div.innerHTML = t + `<div class="title" style="color:var(--amber)">服务繁忙，重试 ${ev.attempt}/4</div>`;
  } else if (ev.type === "critic") {
    const layers = (ev.layers || []).map(l =>
      `<span class="layer">${l.layer.split("_")[0]}</span><span class="bar"><i style="width:${Math.round(l.score * 100)}%;background:${layerColor(l.score)}"></i></span>`).join("");
    const pills = (ev.failures || []).map((f, i) =>
      `<span class="pill red">${zh(FAILURES, f)} · ${zh(SUGGESTIONS, (ev.suggestions || [])[i])}</span>`).join("");
    const measured = ev.detail ? `<div class="sub" style="color:var(--dim)">🔍 ${esc(ev.detail)}</div>` : "";
    div.innerHTML = t + `<div class="title">质量评审 <span class="scoresum" style="color:${layerColor(ev.score)}">${ev.score.toFixed(2)}</span></div>
      <div class="scorebar">${layers}</div>${pills ? `<div>${pills}</div>` : ""}${measured}`;
  } else if (ev.type === "decision") {
    const map = { PASS: ["通过", "green"], RETRY: ["修正后重试", "amber"], FAIL: ["失败", "red"] };
    const [label, cls] = map[ev.decision] || [ev.decision, "gray"];
    let extra = "";
    if (ev.decision === "PASS" && ev.fixes_applied?.length) {
      extra = `<div class="sub" style="color:var(--dim)">已记住：${ev.fixes_applied.map(f => zh(FAILURES, f.failure) + "用" + zh(SUGGESTIONS, f.suggestion) + "修").join("、")}</div>`;
    } else if (ev.decision === "RETRY") {
      extra = `<div class="sub" style="color:var(--dim)">第 ${ev.attempts_used}/${ev.max_attempts} 次</div>`;
    } else if (ev.decision === "FAIL") {
      extra = `<div class="sub" style="color:var(--dim)">多次修正仍未达标</div>`;
    }
    div.innerHTML = t + `<div class="title"><span class="pill ${cls}">${label}</span></div>${extra}`;
  } else if (ev.type === "run.done") {
    const rows = (ev.completed || []).map(c => `<div class="sub">✅ ${ACTIONS[c.action] || c.action}${c.refine_history.length ? `（修正 ${c.refine_history.length} 次）` : ""}</div>`).join("");
    const fails = (ev.failed || []).map(f => `<div class="sub">❌ ${ACTIONS[f.action] || f.action}</div>`).join("");
    div.innerHTML = t + `<div class="title">生产完成</div>${rows || ""}${fails}
      <div class="sub" style="color:var(--dim)">${ev.completed.length} 项完成 · ${ev.attempts} 次尝试 · ${ev.cost_units} 元${ev.budget_exhausted ? " · 预算用尽" : ""}</div>`;
    closeLive("完成");
  }
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function closeLive(tag) {
  setTimeout(() => { if (es) { es.close(); es = null; } }, 300);
  $("liveTitle").textContent = `实时过程 · ${tag}`;
  refreshBrain(); refreshRuns();
}

// ---------- 提交 ----------
async function submitRun() {
  const goal = $("goalInput").value.trim();
  if (!goal) { hint("先输入想做什么", true); return; }
  const provider = $("providerSel").value;
  const project = $("projectInput").value.trim();
  $("runBtn").disabled = true; $("runBtn").textContent = "生产中…";
  try {
    const res = await (await hx("/api/run", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ goal, provider, project })
    })).json();
    if (res.error) throw new Error(res.error);
    startStream(res.run_id);
  } catch (e) {
    // 要把真实原因说出来（实测：只显示「请重试」时用户只会反复点）
    const why = (e && e.message ? String(e.message) : "").trim();
    hint(/unauthorized/i.test(why) ? "还没连上：先在「连接」卡填令牌"
                                   : (why ? "提交失败：" + why : "提交失败，请重试"), true);
  }
  $("runBtn").disabled = false; $("runBtn").textContent = "开始生产";
}

// ---------- SSE 实时 ----------
function startStream(runId) {
  if (es) es.close();
  currentRun = runId;
  const tl = $("timeline");
  tl.innerHTML = ""; $("sumBox").style.display = "none";
  $("liveTitle").textContent = "实时过程";
  es = new EventSource(sseUrl(`/api/stream?run_id=${runId}`));
  es.onmessage = e => {
    const ev = JSON.parse(e.data);
    renderEvent(ev, tl);
    if (ev.type === "run.done") showSummary(ev, runId);
  };
  es.onerror = () => {};
}

function showSummary(ev, runId, aborted) {
  $("sumBox").style.display = "block";
  const rows = (ev.completed || []).map(c =>
    `<div class="line">✅ <b>${ACTIONS[c.action] || c.action}</b> · 质量 ${c.score}${c.refine_history.length ? ` · 修正 ${c.refine_history.length} 次` : ""}</div>`).join("")
    + (aborted ? '<div class="line" style="color:var(--amber)">⚠️ 这次没跑完（服务重启会打断），下面是已经产出的</div>' : "");
  // 真实产物（local provider）：只给落盘的绝对路径做下载/预览链接
  const files = (ev.outputs || []).filter(p => String(p).startsWith("/"));
  // 磁盘为准：有的任务把文件真写出来了却被判失败（实测成片就是这样被漏掉的），
  // 所以把产物目录里真实存在的文件补进来
  apiGet(`/api/run/${encodeURIComponent(runId)}/files`).then(d => {
    for (const f of (d.files || [])) {
      if (!files.some(x => String(x).split("/").pop() === f.name)) files.push(f.name);
    }
    paintArts(files, runId, rows);
  }).catch(() => paintArts(files, runId, rows));
}

function paintArts(files, runId, rows) {
  // 排序：成片最前（他要的第一眼就是成品），然后镜头，最后素材底图
  const rank = p => { const n = String(p).split("/").pop();
    return n.startsWith("final") ? 0 : n.startsWith("shot") ? 1 : 2; };
  files.sort((a, b) => rank(a) - rank(b) || String(a).localeCompare(String(b)));
  const arts = files.map(p => {
    const name = String(p).split("/").pop();
    const url = `/api/artifact?run_id=${encodeURIComponent(runId)}&name=${encodeURIComponent(name)}&token=${encodeURIComponent(TOKEN)}`;
    const kind = name.startsWith("final") ? "成片"
      : name.startsWith("shot") ? "镜头"
      : name.startsWith("asset_") ? "底图（模型起始帧，不是参考图）"
      : "素材";
    const head = `<div class="line">🎬 ${kind} <a href="${url}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(name)}</a></div>`;
    // 页面里直接播/看：手机浏览器点 .mp4 链接多半没反应（真机反馈「视频看不了」）
    if (name.endsWith(".mp4")) return head + `<video class="art" controls playsinline preload="metadata" src="${url}"></video>`;
    if (name.endsWith(".png")) return head + `<img class="art art-img" src="${url}" alt="">`;
    return head;
  }).join("");
  $("sumBody").innerHTML = (rows || '<div class="empty">本次没有完成任务</div>') + arts
    + '<div class="row" style="margin-top:10px"><button id="discardBtn">不满意，删掉这条</button>'
    + '<span id="discardHint"></span></div>';
  const db = $("discardBtn");
  if (db) db.onclick = () => discardRun(runId);      // 删产物 + 撤销档案登记
}

// ---------- 回放 ----------
async function replay(runId) {
  const tl = $("timeline"); tl.innerHTML = ""; $("sumBox").style.display = "none";
  if (es) { es.close(); es = null; }
  currentRun = null;
  $("liveTitle").textContent = "历史回放";
  try {
    const d = await (await hx(`/api/run/${runId}`)).json();
    let done = null;
    for (const ev of d.events) {
      const div = document.createElement("div");
      div.className = "ev " + (ev.type + " " + (ev.decision || "")).toLowerCase();
      const t = `<div class="meta">${fmt(ev.ts)}</div>`;
      const actName = ACTIONS[ev.action] || ev.action;
      let html = "";
      if (ev.type === "run.start") html = t + `<div class="title">开始</div><div class="sub">${esc(ev.goal)}</div>`;
      else if (ev.type === "task.start") html = t + `<div class="title"><span class="act ${ev.kind === "retry" ? "retry" : ""}">${actName}</span></div>`;
      else if (ev.type === "infra.retry") html = t + `<div class="title" style="color:var(--amber)">服务繁忙，重试 ${ev.attempt}/4</div>`;
      else if (ev.type === "critic") html = t + `<div class="title">评审 <span class="scoresum" style="color:${layerColor(ev.score)}">${ev.score.toFixed(2)}</span></div><div>${(ev.failures || []).map(f => `<span class="pill red">${zh(FAILURES, f)}</span>`).join("")}</div>`;
      else if (ev.type === "decision") html = t + `<div class="title">${ev.decision === "PASS" ? "✅ 通过" : ev.decision === "RETRY" ? "🔧 重试" : "❌ 失败"}</div>`;
      else if (ev.type === "run.done") { done = ev; html = t + `<div class="title">完成</div><div class="sub" style="color:var(--dim)">${ev.completed.length} 项完成 · ${ev.attempts} 次尝试</div>`; }
      else continue;
      div.innerHTML = html; tl.appendChild(div);
    }
    // 历史回放同样要交出成品：以前这里只画时间线、再也不打开「执行报告」，
    // 于是在历史里点开任何一次跑都**永远看不到成片**（真机反馈「网页里看不了」的正主）
    const n = tl.querySelectorAll(".ev").length;
    if (n) tl.innerHTML = `<details class="proc"><summary>过程记录（${n} 步，点开看细节）</summary>${tl.innerHTML}</details>`;
    // 没跑完的（服务重启会打断）也要把已有产物给出来——磁盘上有就让他看得到
    showSummary(done || { completed: [], outputs: [] }, runId, !done);
    $("sumBox").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) { tl.innerHTML = '<div class="empty">回放失败</div>'; }
}

// ---------- 分页 ----------
function showPage(name) {
  $("pageProduce").hidden = (name !== "produce");
  $("pageSettings").hidden = (name !== "settings");
  document.querySelectorAll("nav.tabs .tab").forEach(b => b.classList.toggle("on", b.dataset.page === name));
  if (name === "settings") refreshConfig();
}
document.querySelectorAll("nav.tabs .tab").forEach(b => { b.onclick = () => showPage(b.dataset.page); });
// 连令牌都没有 = 还没配好，直接落到设置页（配置都在设置里）
if (!TOKEN) showPage("settings");

// ---------- 设置页：接口配置 ----------
let cfgTimer = null;
function cfgHint(msg) {
  $("cfgHint").textContent = msg;
  clearTimeout(cfgTimer);
  cfgTimer = setTimeout(() => $("cfgHint").textContent = "", 4000);
}
async function refreshConfig() {
  if (!TOKEN) { cfgHint("先在上面填令牌"); return; }
  try {
    const d = await (await hx("/api/config")).json();
    if (d.error) { cfgHint("令牌不对，配置读不到"); return; }
    for (const p of d.providers) {
      const el = p.id === "zhipu" ? $("stZhipu") : $("stKling");
      el.textContent = p.configured ? "已配置 " + p.masked : "未配置";
      el.className = "st " + (p.configured ? "ok" : "no");
    }
    $("videoModel").value = d.options.video_model;
    $("vlmModel").value = d.options.vlm_model;
    $("vlmState").textContent = d.vision.ready ? "已开启 · " + d.vision.model : "未开启";
    $("vlmState").className = "st " + (d.vision.ready ? "ok" : "no");
  } catch (e) { cfgHint("配置读取失败"); }
}
async function saveConfig(provider, keyId) {
  const body = { provider };
  const key = $(keyId).value.trim();
  if (key) body.key = key;
  if (provider === "zhipu") { body.video_model = $("videoModel").value; body.vlm_model = $("vlmModel").value; }
  try {
    const d = await (await hx("/api/config", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body) })).json();
    if (d.ok) { $(keyId).value = ""; cfgHint("已保存，立即生效"); refreshConfig(); }
    else cfgHint("保存失败，请重试");
  } catch (e) { cfgHint("保存失败，请重试"); }
}
$("saveZhipu").onclick = () => saveConfig("zhipu", "keyZhipu");
$("saveKling").onclick = () => saveConfig("kling", "keyKling");
$("videoModel").onchange = () => saveConfig("zhipu", "keyZhipu");
$("vlmModel").onchange = () => saveConfig("zhipu", "keyZhipu");

// ---------- 对话（老大要求：HxMV 也要能聊天）----------
// 说一句话 → 它回一句话 + 给出可执行目标；点「开工」才真的跑。不点就不烧钱、不落档。
let chatHistory = [];   // 只留在内存：刷新即清（对话不需要长期留档）
function chatHint(t, bad) { const el = $("chatHint"); el.textContent = t || ""; el.style.color = bad ? "var(--red)" : "var(--dim)"; }
function chatSay(role, text, goal) {
  const box = $("chatLog"), el = document.createElement("div");
  el.className = "chatMsg " + role;
  el.appendChild(document.createTextNode(text));
  if (goal) {
    const b = document.createElement("button");
    b.className = "goBtn";
    b.textContent = "开工：" + goal;
    b.onclick = () => { $("goalInput").value = goal; chatHint("已填进下面的目标框，点「开始生产」就跑（也可先改两字）"); };
    el.appendChild(b);
  }
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}
async function chatSend() {
  const msg = $("chatInput").value.trim();
  if (!msg) return;
  $("chatInput").value = "";
  chatSay("me", msg);
  chatHint("它正在想…");
  try {
    const d = await postJson("/api/chat", { message: msg, project: $("projectInput").value.trim(), history: chatHistory });
    chatHistory.push({ role: "user", content: msg }, { role: "assistant", content: d.reply });
    chatSay("mv", d.reply, d.goal);
    chatHint(d.llm === false ? "（没配模型 Key：先按你的原话开工）" : "");
  } catch (e) { chatHint(e.message, true); }
}
$("chatSend").onclick = chatSend;
$("chatInput").addEventListener("keydown", e => { if (e.key === "Enter") chatSend(); });

// 不满意就删：删产物 + 撤销它在项目档案里的登记（别再当作设定影响后面）
async function discardRun(runId) {
  if (!runId) return;
  if (!confirm("删掉这次跑的所有片子，并从项目档案里撤销它的登记？")) return;
  const hint = $("discardHint");
  if (hint) hint.textContent = "正在删…";
  try {
    const d = await postJson("/api/discard", { run_id: runId });
    if (hint) hint.textContent = "已删：" + d.removed_files + " 个文件，撤销 " + d.removed_records + " 条登记";
    $("sumBox").style.display = "none";
    refreshRuns();
  } catch (e) { if (hint) hint.textContent = e.message; }
}
$("runBtn").onclick = submitRun;
$("goalInput").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) submitRun(); });

// ---------- 参考图（图生视频的首帧）：上传 → 自动裁主视觉 → 落进项目档案 ----------
function refHint(msg, isErr) { $("refHint").textContent = (isErr ? "⚠ " : "✓ ") + msg; }
function refProject() { return $("projectInput").value.trim(); }
// 选中的图片（支持一次多张）：{ file, key } —— key 是要填的键名（镜头里的角色名／场景名）
let refSel = [];
function fileData(f) {
  return new Promise((ok, no) => {
    const r = new FileReader();
    r.onload = () => ok(r.result);
    r.onerror = () => no(new Error("读不出这个文件"));
    r.readAsDataURL(f);
  });
}
// 统一的 JSON 提交：网关/服务器回了非 JSON（比如体积超限的 413 HTML 页）时给人话，
// 别把「Unexpected token '<'」甩到界面上
async function postJson(path, body) {
  const res = await hx(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const text = await res.text();
  let d;
  try { d = JSON.parse(text); }
  catch (e) {
    throw new Error(res.status === 413 ? "图片太大被网关拦下（HTTP 413）——换小一点的图，或先压一下再传"
                                       : "服务器回了非 JSON 响应（HTTP " + res.status + "）");
  }
  if (d.error) throw new Error(res.status === 401 ? "没连上（令牌没带上）：先在「连接」卡填令牌，或改用带令牌的面板入口再传"
                                                  : d.error);
  return d;
}
function baseName(n) { return String(n || "").replace(/\.[^.]+$/, "").trim(); }
function refreshRefFileLabel() {
  const n = refSel.length;
  $("refFileName").textContent = n <= 1 ? (n ? refSel[0].file.name : "") : "已选 " + n + " 张";
  $("refPreviewBtn").disabled = n !== 1;   // 预览只对单张有意义
}
function renderBatch() {
  const box = $("refBatch");
  box.innerHTML = "";
  if (refSel.length <= 1) return;
  const head = document.createElement("div");
  head.className = "batchHint";
  head.textContent = "选了 " + refSel.length + " 张：给每张起个名（镜头里用的角色名／场景名），再点下面一次存完";
  box.appendChild(head);
  refSel.forEach((it, i) => {
    const row = document.createElement("div");
    row.className = "batchRow";
    const nm = document.createElement("span");
    nm.className = "fname"; nm.textContent = it.file.name;
    const inp = document.createElement("input");
    inp.value = it.key; inp.placeholder = "名字";
    inp.oninput = () => { it.key = inp.value; };
    const rm = document.createElement("button");
    rm.textContent = "×"; rm.title = "移除这张";
    rm.onclick = () => { refSel.splice(i, 1); renderBatch(); refreshRefFileLabel(); };
    row.appendChild(nm); row.appendChild(inp); row.appendChild(rm);
    box.appendChild(row);
  });
  const btn = document.createElement("button");
  btn.id = "refBatchBtn"; btn.textContent = "全部存为参考图";
  btn.onclick = saveBatch;
  box.appendChild(btn);
}
async function saveBatch() {
  const pid = refProject();
  if (!pid) { refHint("先在上面填项目名", true); return; }
  const kind = $("refKind").value, mode = $("refMode").value, total = refSel.length;
  const btn = $("refBatchBtn");
  if (btn) btn.disabled = true;
  let ok = 0, fail = 0, firstErr = "";
  for (let i = 0; i < total; i++) {
    const it = refSel[i], key = (it.key || "").trim();
    if (!key) { fail++; firstErr = firstErr || "有图片还没起名"; continue; }
    refHint("正在存第 " + (i + 1) + "/" + total + " 张：" + key + "…");
    try {
      await postJson("/api/ref", { project: pid, kind: kind, key: key, name: key, mode: mode,
                                   preview: false, image: await fileData(it.file) });
      ok++;
    } catch (e) { fail++; firstErr = firstErr || (key + "：" + e.message); }
  }
  if (btn) btn.disabled = false;
  refHint("批量完成：成功 " + ok + " 张" + (fail ? "，失败 " + fail + " 张 —— " + firstErr : ""), fail > 0);
  refreshRef();
}
async function refPayload(preview) {
  const pid = refProject();
  if (!pid) throw new Error("先在上面填项目名");
  const key = $("refKey").value.trim();
  if (!preview && !key) throw new Error("填一个键名（镜头里的角色名／场景名）");
  if (!refSel.length) throw new Error("先选一张图片");
  return { project: pid, kind: $("refKind").value, key: key, name: key,
           mode: $("refMode").value, preview: !!preview, image: await fileData(refSel[0].file) };
}
function hxUrl(path) { return path + (path.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(TOKEN); }
async function refreshRef() {
  const box = $("refList"), pid = refProject();
  if (!pid) { box.innerHTML = ""; refHint("上面填了项目名，就能传参考图"); return; }
  let d = { characters: [], scenes: [] };
  try { d = await (await hx("/api/ref?project=" + encodeURIComponent(pid))).json(); } catch (e) {}
  const items = [].concat(
    (d.characters || []).map(x => Object.assign({}, x, { kind: "character", label: "角色" })),
    (d.scenes || []).map(x => Object.assign({}, x, { kind: "scene", label: "场景" })));
  if (!items.length) {
    box.innerHTML = '<div class="empty">这个项目还没有参考图——传一张，镜头就从它开始动</div>';
    refHint("上面填了项目名，就能传参考图");
    return;
  }
  box.innerHTML = "";
  refHint("这个项目已有 " + items.length + " 张参考图（镜头会从它们开始动）");
  for (const it of items) {
    const el = document.createElement("div");
    el.className = "refItem";
    el.innerHTML = '<img src="' + hxUrl(it.url) + '" alt=""><b>' + esc(it.label + "·" + it.key) + '</b>'
      + (it.placeholder ? '<b style="color:var(--amber)">占位（系统生成，建议换成真图）</b>' : "")
      + (it.exists ? '<button title="注销">×</button>' : '<b style="color:var(--red)">文件丢了</b>');
    if (it.exists) el.querySelector("button").onclick = () => delRef(it);
    box.appendChild(el);
  }
}
async function delRef(it) {
  const q = "?project=" + encodeURIComponent(refProject()) + "&kind=" + it.kind + "&key=" + encodeURIComponent(it.key);
  const d = await (await fetch("/api/ref" + q, { method: "DELETE", headers: { "X-Hxmv-Token": TOKEN } })).json();
  refHint(d.removed ? "已注销「" + it.key + "」" : (d.detail || "没找到"), !d.removed);
  refreshRef();
}
$("refPreviewBtn").onclick = async () => {
  try {
    refHint("正在裁…");
    const d = await postJson("/api/ref", await refPayload(true));
    const img = $("refPreview");
    img.src = d.preview; img.style.display = "block";
    const sw = d.src_size[0], sh = d.src_size[1], ow = d.out_size[0], oh = d.out_size[1];
    refHint("预览：" + sw + "×" + sh + " → " + ((sw === ow && sh === oh) ? "原样保留" : "裁成 " + ow + "×" + oh));
  } catch (e) { refHint(e.message, true); }
};
$("refSaveBtn").onclick = async () => {
  try {
    refHint("正在存…");
    const d = await postJson("/api/ref", await refPayload(false));
    const img = $("refPreview");
    img.src = hxUrl("/api/ref/image?project=" + encodeURIComponent(d.project) + "&kind=" + d.kind + "&key=" + encodeURIComponent(d.key));
    img.style.display = "block";
    refHint("已登记 " + d.out_size[0] + "×" + d.out_size[1] + "：跑生产时不要用 --fresh，否则档案会被清掉");
    refreshRef();
  } catch (e) { refHint(e.message, true); }
};
$("refFile").onchange = () => {
  refSel = Array.from($("refFile").files).map(f => ({ file: f, key: baseName(f.name) }));
  renderBatch();
  refreshRefFileLabel();
  $("refPreview").style.display = "none";
  if (!refSel.length) refHint("还没选图片");
  else if (refSel.length === 1) refHint("已选好图片，点「预览」看裁切效果");
  else refHint("选了 " + refSel.length + " 张：起好名点「全部存为参考图」");
};
$("projectInput").addEventListener("change", refreshRef);
$("projectInput").addEventListener("blur", refreshRef);

refreshConn();
refreshBrain(); refreshRuns();
refreshRef();
setInterval(refreshBrain, 10000);
</script>
</body>
