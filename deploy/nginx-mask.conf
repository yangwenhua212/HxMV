# HxMV 反代日志脱敏（放进 /etc/nginx/conf.d/，再在 server 块里指定 access_log）
#
# 为什么需要：面板 URL 可能带 ?token=xxx（一次性收藏链接）或 /k/<令牌>（私人入口），
# 默认 combined 日志格式会把整条 URI 原样写进 access.log —— 令牌就明文躺在日志里了。
#
# 用法：
#   1) 把本文件拷到 /etc/nginx/conf.d/00-log-mask.conf
#   2) 在你的 server 块里加：  access_log /var/log/nginx/hxmv.access.log masked;
#   3) sudo nginx -t && sudo systemctl reload nginx

map $args $safe_args {
    default         $args;
    "~*token=[^&]*" "token=***";
}

map $uri $safe_uri {
    default       $uri;
    "~*^/k/[^/]+" "/k/***";
}

log_format masked '$remote_addr - [$time_local] "$request_method $safe_uri$is_args$safe_args $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
